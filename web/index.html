<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect x='7' y='4' width='18' height='24' rx='1.5' fill='%23fffefb' stroke='%231f1e1c' stroke-width='1.5'/><circle cx='21' cy='22' r='2.4' fill='%23b5452e'/></svg>" />
    <title>emditor</title>
    <script>
      // Set the theme before the first paint, so a dark page does not flash white.
      try {
        const choice = JSON.parse(localStorage.getItem('emditor.theme') ?? '"system"')
        const dark = choice === 'dark' || (choice !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
