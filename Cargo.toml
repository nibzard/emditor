[package]
name = "emditor"
version = "0.1.0"
edition = "2024"
description = "A small local Markdown desk: A4 previews, side-by-side panes, rich and source editing."

[dependencies]
axum = "0.8"
mime_guess = "2"
rust-embed = { version = "8", features = ["mime-guess"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "fs", "io-util", "signal"] }
walkdir = "2"

[dev-dependencies]
http-body-util = "0.1"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
